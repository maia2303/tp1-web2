name: CI - Compilacion y pruebas

on:
  push:
  pull_request:

jobs:
  verificar:
    name: Compilar y probar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Instalar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25' 
          cache: maven

      - name: 1. Compilar el proyecto y las pruebas
        run: ./mvnw -B test-compile

      - name: 2. Pruebas unitarias
        run: ./mvnw -B test

      - name: 3. Pruebas de integración y cobertura
        run: ./mvnw -B verify

      - name: Guardar el reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-de-cobertura
          path: target/site/jacoco